<!DOCTYPE html>
<html lang="lo" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ລະບົບຈັດການຂໍ້ມູນ & ຜັງຕະກຸນ XIONG (Cloud Shared)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ດຶງ Supabase Client JS ສຳລັບເຊື່ອມຕໍ່ Cloud Database ໂດຍກົງ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Noto Sans Lao', 'Phetsarath OT', sans-serif !important; }
        body { background-color: #f8fafc; color: #1e293b; margin: 0; padding: 0; }
        
        @media print { 
            @page { size: landscape; margin: 10mm; } 
            .no-print { display: none !important; } 
            body { background: white; margin: 0; padding: 0; } 
            .print-tree-container { width: 100% !important; overflow: visible !important; transform: scale(0.9); transform-origin: top left; border: none !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 🟢 ຕັ້ງຄ່າ Supabase (ເອົາ URL ແລະ Anon Key ມາຈາກ Project ຂອງທ່ານໃນ supabase.com)
        const SUPABASE_URL = 'YOUR_SUPABASE_URL_HERE'; 
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const fileToBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        const formatDisplayDate = (dateStr) => {
          if (!dateStr) return 'ບໍ່ລະບຸ';
          const match = dateStr.match(/^(\d{4})-(\d{2})-(\d{2})/);
          if (match) {
            const [, y, m, d] = match;
            if (m === '01' && d === '01') return y;
            return `${parseInt(d, 10)}/${parseInt(m, 10)}/${y}`;
          }
          return dateStr;
        };

        const calculateGeneration = (currentMember, membersList, visited = new Set()) => {
          if (!currentMember || visited.has(currentMember.id)) return 1;
          visited.add(currentMember.id);

          const father = membersList.find(m => m.id === currentMember.father_id);
          const mother = membersList.find(m => m.id === currentMember.mother_id);

          if (father) return calculateGeneration(father, membersList, visited) + 1;
          if (mother) return calculateGeneration(mother, membersList, visited) + 1;

          const spouse = membersList.find(m => 
            (m.id === currentMember.spouse_id || currentMember.id === m.spouse_id) && m.id !== currentMember.id
          );
          if (spouse && !visited.has(spouse.id)) {
            return calculateGeneration(spouse, membersList, visited);
          }

          return 1;
        };

        const MemberReportCard = ({ member, allMembers = [], user, onOpenActivityModal, lang }) => {
          const [memberActivities, setMemberActivities] = useState([]);

          useEffect(() => {
            const fetchActivities = async () => {
              const { data } = await supabase.from('member_activities').select('*').eq('member_id', member.id);
              if (data) setMemberActivities(data);
            };
            fetchActivities();
          }, [member.id]);

          const father = allMembers.find(m => m.id === member.father_id);
          const mother = allMembers.find(m => m.id === member.mother_id);
          const spouse = allMembers.find(m => m.id === member.spouse_id || member.id === m.spouse_id);
          
          const generationNumber = calculateGeneration(member, allMembers);
          const rowStyle = { fontSize: '15px', lineHeight: '1.6', color: '#000', textAlign: 'left' };
          const phoneNumber = member.phone || '-';
          const headerTexts = { lao: 'ສະມາຊິກຄອບຄົວ ມົ້ງຊົ່ງ', en: 'Hmong Song Family Member', mo: 'Tsev Neeg Hmoob Xong' };
          const currentHeaderTitle = headerTexts[lang] || headerTexts.lao;

          return (
            <div style={{ width: '100%', maxWidth: '210mm', padding: '5mm 0', marginBottom: '15px', borderBottom: '1px dashed #ccc', background: '#fff', boxSizing: 'border-box', color: '#000', pageBreakInside: 'avoid', breakInside: 'avoid' }}>
              <div style={{ textAlign: 'center', marginBottom: '20px', borderBottom: '2px solid #0284c7', paddingBottom: '10px' }}>
                <h2 style={{ margin: 0, color: '#0369a1', fontSize: '20px', fontWeight: 'bold' }}>{currentHeaderTitle} (LAUJ KAUB NYAJ)</h2>
              </div>

              <div style={{ display: 'flex', width: '100%', alignItems: 'flex-start', marginBottom: '8px' }}>
                <div style={{ width: '4cm', minWidth: '4cm', height: '5.2cm', minHeight: '5.2cm', marginRight: '20px', background: '#fff', overflow: 'hidden' }}>
                  {member.photo_url ? (
                    <img src={member.photo_url} alt="Member" style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
                  ) : (
                    <div style={{ padding: '30px 10px', textAlign: 'center', color: '#888', fontSize: '12px', border: '1px dashed #ccc', height: '100%', boxSizing: 'border-box' }}>ບໍ່ມີຮູບພາບ</div>
                  )}
                </div>

                <div style={{ flex: '1', display: 'flex', flexDirection: 'column', justifyContent: 'flex-start' }}>
                  <div style={rowStyle}><strong>ຊື່ ແລະ ນາມສະກຸນ:</strong> {member.first_name} {member.last_name}</div>
                  <div style={rowStyle}><strong>ຮຸ່ນ:</strong> P.{generationNumber}</div>
                  <div style={rowStyle}><strong>ວັນເກີດ:</strong> {formatDisplayDate(member.birth_date)}</div>
                  <div style={rowStyle}><strong>ບ້ານເກີດ:</strong> {member.birth_village || '-'}</div>
                  <div style={rowStyle}><strong>ເມືອງເກີດ:</strong> {member.birth_district || '-'}</div>
                  <div style={rowStyle}><strong>ແຂວງເກີດ:</strong> {member.birth_province || '-'}</div>
                  <div style={rowStyle}><strong>ຄູ່ສົມລົດ:</strong> {spouse ? `${spouse.first_name} ${spouse.last_name}` : '-'}</div>
                  <div style={rowStyle}><strong>ຊື່ພໍ່:</strong> {father ? `${father.first_name} ${father.last_name}` : '-'}</div>
                  <div style={rowStyle}><strong>ຊື່ແມ່:</strong> {mother ? `${mother.first_name} ${mother.last_name}` : '-'}</div>
                </div>
              </div>

              <div style={{ width: '100%' }}>
                <div style={rowStyle}><strong>ບ້ານຢູ່ປະຈຸບັນ:</strong> {member.village || '-'}</div>
                <div style={rowStyle}><strong>ເມືອງ:</strong> {member.district || '-'}</div>
                <div style={rowStyle}><strong>ແຂວງ:</strong> {member.province || '-'}</div>
                <div style={rowStyle}><strong>ເບີໂທລະສັບ:</strong> {phoneNumber}</div>
                <div style={{ ...rowStyle, marginTop: '2px' }}>
                  <strong>ປະຫວັດຫຍໍ້/ຂໍ້ມູນເພີ່ມເຕີມ:</strong>
                  <div style={{ marginTop: '2px', lineHeight: '1.5' }}>{member.bio || ''}</div>
                  {member.note && <div style={{ marginTop: '4px', color: '#be123c' }}><strong>ໝາຍເຫດ:</strong> {member.note}</div>}
                </div>
              </div>

              <div style={{ marginTop: '20px', paddingTop: '15px', borderTop: '2px solid #e2e8f0' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                  <h4 style={{ margin: '0', color: '#0369a1', fontSize: '16px', fontWeight: 'bold' }}>📸 ກິດຈະກຳ, ທ່ອງທ່ຽວ & ຮູບພາບຄວາມຊົງຈຳ ({memberActivities.length})</h4>
                  {user && user.role === 'ADMIN' && onOpenActivityModal && (
                    <button onClick={() => onOpenActivityModal(member)} className="no-print" style={{ background: '#0284c7', color: 'white', border: 'none', padding: '6px 12px', borderRadius: '6px', cursor: 'pointer', fontSize: '13px', fontWeight: 'bold' }}>➕ ເພີ່ມກິດຈະກຳ</button>
                  )}
                </div>

                {memberActivities.length > 0 ? (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '15px', marginTop: '10px' }}>
                    {memberActivities.map((act) => (
                      <div key={act.id} style={{ display: 'flex', width: '100%', alignItems: 'flex-start', background: '#f8fafc', padding: '10px', borderRadius: '8px', border: '1px solid #cbd5e1' }}>
                        <div style={{ width: '4cm', minWidth: '4cm', height: '5.2cm', minHeight: '5.2cm', marginRight: '20px', background: '#fff', overflow: 'hidden', borderRadius: '6px', border: '1px solid #cbd5e1' }}>
                          <img src={act.photo_url} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
                        </div>
                        <div style={{ flex: '1', display: 'flex', flexDirection: 'column', justifyContent: 'flex-start' }}>
                          <div style={rowStyle}><strong>ຫົວຂໍ້ກິດຈະກຳ:</strong> {act.title || '-'}</div>
                          <div style={rowStyle}><strong>ວັນທີ/ປີ ເຮັດກິດຈະກຳ:</strong> {act.activity_date || '-'}</div>
                          <div style={{ ...rowStyle, marginTop: '4px' }}><strong>ຄຳບັນຍາຍ / ເລົ່າເລື່ອງລາວ:</strong><div style={{ marginTop: '2px', lineHeight: '1.5', color: '#334155' }}>{act.description || '-'}</div></div>
                        </div>
                      </div>
                    ))}
                  </div>
                ) : (
                  <p style={{ fontSize: '13px', color: '#94a3b8', fontStyle: 'italic', margin: '5px 0' }}>ຍັງບໍ່ມີຂໍ້ມູນກິດຈະກຳ ຫຼື ຮູບພາບການທ່ອງທ່ຽວ</p>
                )}
              </div>
            </div>
          );
        };

        const translations = {
          lao: { login: 'ເຂົ້າສູ່ລະບົບ', username: 'ຊື່ຜູ້ໃຊ້', password: 'ລະຫັດຜ່ານ', title: 'ລະບົບຈັດການຂໍ້ມູນ & ຜັງຕະກຸນXIONG', userLabel: 'ຜູ້ໃຊ້', printAll: '📊 ພິມລາຍງານລວມທັງໝົດ', logout: 'ອອກຈາກລະບົບ', addMember: '👤 ເພີ່ມຂໍ້ມູນຍາດພີ່ນ້ອງໃໝ່', editMember: '📝 ແກ້ໄຂຂໍ້ມູນ', firstName: 'ຊື່', lastName: 'ນາມສະກຸນ', gender: 'ເພດ', male: 'ຊາຍ', female: 'ຍິງ', birthDate: 'ວັນເກີດ (ພິມ dd/mm/yyyy ຫຼື ປີ)', birthVillage: 'ບ້ານເກີດ', birthDistrict: 'ເມືອງເກີດ', birthProvince: 'ແຂວງເກີດ', spouse: 'ຜົວ / ເມຍ', selectSpouse: '-- ເລືອກຄູ່ສົມລົດ --', father: 'ພໍ່', selectFather: '-- ເລືອກພໍ່ --', mother: 'ແມ່', selectMother: '-- ເລືອກແມ່ --', village: 'ບ້ານຢູ່ປະຈຸບັນ', district: 'ເມືອງ', province: 'ແຂວງ', phone: 'ເບີໂທລະສັບ', selectPhoto: 'ເລືອກຮູບພາບ', bio: 'ປະຫວັດຫຍໍ້:', save: 'ບັນທຶກ', cancel: 'ຍົກເລີກ', searchPlaceholder: '🔍 ຄົ້ນຫາຕາມ ຊື່, ບ້ານ...', listView: '📋 ແບບລາຍຊື່', treeView: '🌿 ແບບຜັງຕົ້ນໄມ້', specificReport: '📄 ໃບລາຍງານສະເພາະ', backToHome: '⬅️ ກັບຄືນໜ້າຫຼັກ', printReport: '🖨️ ພິມໃບລາຍງານ', printTree: '🖨️ ພິມຜັງຕົ້ນໄມ້', successTitle: 'ສຳເລັດ', ok: 'ຕົກລົງ', yes: 'ຕົກລົງ (ລຶບ)' }
        };

        const parseDateForServer = (inputDate) => {
          if (!inputDate) return '';
          const trimmed = inputDate.trim();
          const dmyMatch = trimmed.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
          if (dmyMatch) { const [, d, m, y] = dmyMatch; return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`; }
          const yearMatch = trimmed.match(/^(\d{4})$/);
          if (yearMatch) return `${yearMatch[1]}-01-01`;
          return trimmed;
        };

        function App() {
          const [lang, setLang] = useState('lao');
          const t = translations[lang] || translations.lao;

          const [user, setUser] = useState(() => {
              const u = localStorage.getItem('family_tree_user');
              const r = localStorage.getItem('family_tree_role');
              return u ? { username: u, role: r } : null;
          });
          const [loginForm, setLoginForm] = useState({ username: '', password: '' });

          const [members, setMembers] = useState([]);
          const [allActivities, setAllActivities] = useState([]);
          const [auditLogs, setAuditLogs] = useState([]);
          const [emergencyBanner, setEmergencyBanner] = useState('');
          const [isEditingBanner, setIsEditingBanner] = useState(false);
          const [bannerInput, setBannerInput] = useState('');

          const [editingId, setEditingId] = useState(null);
          const [selectedFile, setSelectedFile] = useState(null);
          const [searchTerm, setSearchTerm] = useState('');
          const [viewMode, setViewMode] = useState('list');
          const [reportingMember, setReportingMember] = useState(null); 
          const [isFullReport, setIsFullReport] = useState(false); 

          const [activityModalMember, setActivityModalMember] = useState(null);
          const [activityForm, setActivityForm] = useState({ title: '', description: '', activity_date: '' });
          const [activityFile, setActivityFile] = useState(null);

          const [modalConfig, setModalConfig] = useState({ isOpen: false, title: '', message: '', onConfirm: null, isConfirm: false });

          // 🟢 ດຶງຂໍ້ມູນຈາກ Cloud (Supabase) ໃຫ້ທุกເຄື່ອງເຫັນຄືກັນ
          const loadDataFromCloud = async () => {
            try {
              const { data: memData } = await supabase.from('members').select('*');
              if (memData) setMembers(memData);

              const { data: actData } = await supabase.from('member_activities').select('*');
              if (actData) setAllActivities(actData);

              const { data: logData } = await supabase.from('audit_logs').select('*').order('id', { ascending: false }).limit(5);
              if (logData) setAuditLogs(logData);

              const { data: banData } = await supabase.from('emergency_banner').select('*').limit(1);
              if (banData && banData.length > 0) {
                setEmergencyBanner(banData[0].message);
                setBannerInput(banData[0].message);
              }
            } catch (err) {
              console.error('Error loading cloud data:', err);
            }
          };

          useEffect(() => {
            if (user) {
              loadDataFromCloud();
            }
          }, [user]);

          const showAlert = (message, title = t.successTitle) => setModalConfig({ isOpen: true, title, message, isConfirm: false, onConfirm: null });
          const showConfirm = (message, onConfirm, title = t.successTitle) => setModalConfig({ isOpen: true, title, message, isConfirm: true, onConfirm });
          const closeModal = () => setModalConfig({ isOpen: false, title: '', message: '', onConfirm: null, isConfirm: false });

          const addLogGrid = async (action_text) => {
            const newLog = { username: user?.username || 'SYSTEM', action_text, created_at: new Date().toISOString() };
            await supabase.from('audit_logs').insert([newLog]);
            loadDataFromCloud();
          };

          const initialFormState = { first_name: '', last_name: 'ຊົ່ງ', gender: 'Male', birth_date: '', birth_village: '', birth_district: '', birth_province: '', father_id: '', mother_id: '', spouse_id: '', village: '', district: '', province: '', bio: '', photo_url: '', phone: '', note: '' };
          const [formData, setFormData] = useState(initialFormState);

          const handleSaveBanner = async () => {
            await supabase.from('emergency_banner').delete().neq('id', 0);
            await supabase.from('emergency_banner').insert([{ message: bannerInput }]);
            setEmergencyBanner(bannerInput);
            setIsEditingBanner(false);
            addLogGrid('ອັບເດດປະກາດຂ່າວສຸກເສີນ');
            showAlert('ອັບເດດປະກາດຂ່າວສຸກເສີນສຳເລັດ!');
          };

          const handleLoginSubmit = (e) => {
            e.preventDefault();
            let role = loginForm.username.includes('ADMIN') ? 'ADMIN' : 'USER';
            setUser({ username: loginForm.username, role: role });
            localStorage.setItem('family_tree_user', loginForm.username);
            localStorage.setItem('family_tree_role', role);
            setLoginForm({ username: '', password: '' });
          };

          const handleLogout = () => { 
            localStorage.removeItem('family_tree_user'); 
            localStorage.removeItem('family_tree_role'); 
            setUser(null); 
          };

          const handleFileChange = (e) => { const file = e.target.files[0]; if (file) setSelectedFile(file); };

          const handleEdit = (member) => {
            if (user.role !== 'ADMIN') { showAlert('ສິດ USER ບໍ່ສາມາດແກ້ໄຂຂໍ້ມູນໄດ້'); return; }
            setEditingId(member.id); setSelectedFile(null);
            let fDate = member.birth_date || '';
            if (/^\d{4}-01-01$/.test(fDate)) fDate = fDate.split('-')[0];
            else if (/^\d{4}-\d{2}-\d{2}$/.test(fDate)) { const [y, m, d] = fDate.split('-'); fDate = `${parseInt(d, 10)}/${parseInt(m, 10)}/${y}`; }
            setFormData({ ...member, birth_date: fDate, father_id: member.father_id || '', mother_id: member.mother_id || '', spouse_id: member.spouse_id || '' });
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };

          const handleCancelEdit = () => { setEditingId(null); setSelectedFile(null); setFormData(initialFormState); };

          const handleDelete = (id, name) => {
            if (user.role !== 'ADMIN') { showAlert('ສິດ USER ບໍ່ສາມາດລຶບຂໍ້ມູນໄດ້'); return; }
            showConfirm(`ທ່ານຕ້ອງການລຶບຂໍ້ມູນຂອງ "${name}" ແທ້ບໍ?`, async () => {
              await supabase.from('members').delete().eq('id', id);
              addLogGrid(`ລຶບຂໍ້ມູນ: ${name}`);
              loadDataFromCloud();
              showAlert('ລຶບຂໍ້ມູນສຳເລັດ!');
            });
          };

          const handleSubmit = async (e) => {
            e.preventDefault();
            let finalPhotoUrl = formData.photo_url;
            if (selectedFile) finalPhotoUrl = await fileToBase64(selectedFile); 

            const newMem = { 
                first_name: formData.first_name,
                last_name: formData.last_name,
                gender: formData.gender,
                birth_date: parseDateForServer(formData.birth_date),
                birth_village: formData.birth_village,
                birth_district: formData.birth_district,
                birth_province: formData.birth_province,
                father_id: formData.father_id ? parseInt(formData.father_id) : null,
                mother_id: formData.mother_id ? parseInt(formData.mother_id) : null,
                spouse_id: formData.spouse_id ? parseInt(formData.spouse_id) : null,
                village: formData.village,
                district: formData.district,
                province: formData.province,
                bio: formData.bio,
                photo_url: finalPhotoUrl,
                phone: formData.phone,
                note: formData.note
            };

            if (editingId) {
                await supabase.from('members').update(newMem).eq('id', editingId);
                addLogGrid(`ແກ້ໄຂຂໍ້ມູນຂອງ: ${newMem.first_name} ${newMem.last_name}`);
                showAlert('ອັບເດດຂໍ້ມູນສຳເລັດ!');
            } else {
                await supabase.from('members').insert([newMem]);
                addLogGrid(`ເພີ່ມຂໍ້ມູນສະມາຊິກໃໝ່: ${newMem.first_name} ${newMem.last_name}`);
                showAlert('ບັນທຶກຂໍ້ມູນສຳເລັດ!');
            }
            handleCancelEdit();
            loadDataFromCloud();
          };

          const handleActivitySubmit = async (e) => {
            e.preventDefault();
            if (!activityFile) { showAlert('ກະລຸນາເລືອກຮູບພາບກິດຈະກຳ'); return; }
            
            const b64 = await fileToBase64(activityFile);
            const newAct = {
                member_id: activityModalMember.id,
                photo_url: b64,
                title: activityForm.title,
                description: activityForm.description,
                activity_date: activityForm.activity_date
            };
            
            await supabase.from('member_activities').insert([newAct]);
            addLogGrid(`ເພີ່ມກິດຈະກຳໃຫ້: ${activityModalMember.first_name}`);
            showAlert('ເພີ່ມຮູບກິດຈະກຳສຳເລັດແລ້ວ!');
            setActivityModalMember(null); setActivityFile(null); setActivityForm({ title: '', description: '', activity_date: '' });
            loadDataFromCloud();
          };

          const compareAge = (a, b) => {
            if (a.birth_date && b.birth_date) return new Date(a.birth_date) - new Date(b.birth_date);
            if (a.birth_date && !b.birth_date) return -1;
            if (!a.birth_date && b.birth_date) return 1;
            return a.id - b.id;
          };

          const sortFamilyTreeForList = (allMembers) => {
            const visited = new Set();
            const sorted = [];
            const traversePersonAndDescendants = (person) => {
              if (!person || visited.has(person.id)) return;
              visited.add(person.id);
              sorted.push(person);
              const spouses = allMembers.filter(m => (m.id === person.spouse_id || person.id === m.spouse_id) && m.id !== person.id).sort(compareAge);
              if (spouses.length > 0 && person.gender === 'Male') {
                for (const wife of spouses) {
                  if (!visited.has(wife.id)) { visited.add(wife.id); sorted.push(wife); }
                  const childrenOfWife = allMembers.filter(m => (m.father_id === person.id && m.mother_id === wife.id) || (m.father_id === person.id && !m.mother_id && wife === spouses[0])).sort(compareAge);
                  for (const child of childrenOfWife) traversePersonAndDescendants(child);
                }
              } else {
                const directChildren = allMembers.filter(m => (person.gender === 'Male' ? m.father_id === person.id : m.mother_id === person.id)).sort(compareAge);
                for (const child of directChildren) traversePersonAndDescendants(child);
              }
            };
            const rootMembers = allMembers.filter(m => !m.father_id && !m.mother_id && (m.gender === 'Male' || !m.spouse_id)).sort(compareAge);
            for (const root of rootMembers) traversePersonAndDescendants(root);
            for (const m of allMembers) { if (!visited.has(m.id)) { visited.add(m.id); sorted.push(m); } }
            return sorted;
          };

          const sortedMembers = sortFamilyTreeForList(members);
          const filteredMembers = sortedMembers.filter(m => {
            const fullName = `${m.first_name || ''} ${m.last_name || ''}`.toLowerCase();
            const location = `${m.village || ''} ${m.district || ''} ${m.province || ''}`.toLowerCase();
            return fullName.includes(searchTerm.toLowerCase()) || location.includes(searchTerm.toLowerCase());
          });

          const renderMemberCard = (member) => {
            const generationNumber = calculateGeneration(member, members);
            const maleSilhouetteSvg = <svg viewBox="0 0 24 24" width="55" height="55" fill="#64748b" style={{ margin: 'auto' }}><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>;
            const femaleSilhouetteSvg = <svg viewBox="0 0 24 24" width="55" height="55" fill="#64748b" style={{ margin: 'auto' }}><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v1h16v-1c0-2.66-5.33-4-8-4z"/></svg>;

            return (
              <div key={member.id} style={{ border: `2px solid ${member.gender === 'Male' ? '#0284c7' : '#ec4899'}`, background: member.gender === 'Male' ? '#f0f9ff' : '#fdf2f8', borderRadius: '16px', padding: '14px 10px', width: '160px', textAlign: 'center', boxShadow: '0 4px 6px rgba(0,0,0,0.08)', flexShrink: 0, position: 'relative' }}>
                <div style={{ position: 'absolute', top: '6px', right: '8px', background: member.gender === 'Male' ? '#0284c7' : '#ec4899', color: '#ffffff', fontSize: '11px', fontWeight: 'bold', padding: '2px 6px', borderRadius: '6px', lineHeight: '1' }}>P.{generationNumber}</div>
                <div style={{ width: '90px', height: '90px', borderRadius: '50%', overflow: 'hidden', margin: '0 auto 8px auto', background: '#e2e8f0', border: `2px solid ${member.gender === 'Male' ? '#bae6fd' : '#fbcfe8'}`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  {member.photo_url ? <img src={member.photo_url} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover' }} /> : (member.gender === 'Female' ? femaleSilhouetteSvg : maleSilhouetteSvg)}
                </div>
                <strong style={{ fontSize: '15px', color: member.gender === 'Male' ? '#0369a1' : '#be185d', display: 'block', lineHeight: '1.4' }}>{member.first_name} {member.last_name}</strong>
              </div>
            );
          };

          const renderTreeNode = (member, renderedSet = new Set()) => {
            if (!member || renderedSet.has(member.id)) return null;
            renderedSet.add(member.id);

            const spouses = members.filter(m => m.id === member.spouse_id || m.spouse_id === member.id || (m.gender === 'Female' && members.some(child => child.father_id === member.id && child.mother_id === m.id)) || (m.gender === 'Male' && members.some(child => child.mother_id === member.id && child.father_id === m.id))).sort(compareAge);
            spouses.forEach(s => renderedSet.add(s.id));
            let husband = member.gender === 'Male' ? member : (spouses.find(s => s.gender === 'Male') || null);
            let wives = member.gender === 'Female' ? [member, ...spouses.filter(s => s.gender === 'Female' && s.id !== member.id)] : spouses.filter(s => s.gender === 'Female');

            const wife1 = wives[0] || null; const wife2 = wives[1] || null;
            const childrenWife1 = husband && wife1 ? members.filter(m => (m.father_id === husband.id && m.mother_id === wife1.id) || (m.father_id === husband.id && !m.mother_id && wife === spouses[0])).sort(compareAge) : [];
            const childrenWife2 = husband && wife2 ? members.filter(m => m.father_id === husband.id && m.mother_id === wife2.id).sort(compareAge) : [];
            const allChildren = [...childrenWife1, ...childrenWife2];

            const spouseIds = spouses.map(s => s.id);
            const childrenGeneral = members.filter(m => m.father_id === member.id || m.mother_id === member.id || spouseIds.includes(m.father_id) || spouseIds.includes(m.mother_id)).sort(compareAge);
            const targetChildren = allChildren.length > 0 ? allChildren : childrenGeneral;

            return (
              <div key={member.id} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', position: 'relative' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                  {wives.length >= 2 ? (<>{renderMemberCard(wife1)}<div style={{ fontWeight: 'bold', color: '#ef4444', fontSize: '18px' }}>❤️</div>{husband ? renderMemberCard(husband) : renderMemberCard(member)}<div style={{ fontWeight: 'bold', color: '#ef4444', fontSize: '18px' }}>❤️</div>{renderMemberCard(wife2)}</>) : wives.length === 1 && husband && husband.id !== wives[0].id ? (<>{renderMemberCard(husband)}<div style={{ fontWeight: 'bold', color: '#ef4444', fontSize: '18px' }}>❤️</div>{renderMemberCard(wives[0])}</>) : (renderMemberCard(member))}
                </div>
                {targetChildren.length > 0 && (
                  <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', position: 'relative' }}>
                    <div style={{ width: '3px', height: '22px', background: '#000000' }}></div>
                    {targetChildren.length === 1 ? (
                      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                        <div style={{ width: '3px', height: '18px', background: '#000000' }} />
                        {renderTreeNode(targetChildren[0], new Set(renderedSet))}
                      </div>
                    ) : (
                      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', position: 'relative' }}>
                        <div style={{ position: 'absolute', top: 0, left: '80px', right: '80px', height: '3px', background: '#000000', zIndex: 1 }}></div>
                        <div style={{ display: 'flex', justifyContent: 'center', gap: '20px', position: 'relative', paddingTop: '18px' }}>
                          {targetChildren.map(child => (
                            <div key={child.id} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', position: 'relative' }}>
                              <div style={{ position: 'absolute', top: '-18px', width: '3px', height: '18px', background: '#000000', zIndex: 2 }} />
                              {renderTreeNode(child, new Set(renderedSet))}
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            );
          };

          const rootMembers = members.filter(m => !m.father_id && !m.mother_id && (m.gender === 'Male' || !m.spouse_id)).sort(compareAge);

          if (!user) {
            return (
              <div translate="no" lang={lang} style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', minHeight: '100vh', background: '#f1f5f9', fontFamily: "'Noto Sans Lao', 'Phetsarath OT', sans-serif" }}>
                <div style={{ background: 'white', padding: '35px', borderRadius: '12px', boxShadow: '0 4px 15px rgba(0,0,0,0.1)', width: '100%', maxWidth: '380px' }}>
                  <h2 style={{ textAlign: 'center', color: '#1e293b', marginTop: 0, marginBottom: '20px', fontWeight: 'bold', fontSize: '22px' }}>🌳 {t.login} (Cloud Shared)</h2>
                  <form onSubmit={handleLoginSubmit}>
                    <div style={{ marginBottom: '15px' }}>
                      <label style={{ display: 'block', marginBottom: '5px', color: '#475569', fontWeight: 'bold' }}>{t.username}</label>
                      <input type="text" required value={loginForm.username} onChange={e => setLoginForm({...loginForm, username: e.target.value})} style={inputStyle} />
                    </div>
                    <div style={{ marginBottom: '20px' }}>
                      <label style={{ display: 'block', marginBottom: '5px', color: '#475569', fontWeight: 'bold' }}>{t.password}</label>
                      <input type="password" required value={loginForm.password} onChange={e => setLoginForm({...loginForm, password: e.target.value})} style={inputStyle} />
                    </div>
                    <button type="submit" style={{ width: '100%', background: '#0284c7', color: 'white', border: 'none', padding: '11px', borderRadius: '6px', cursor: 'pointer', fontSize: '16px', fontWeight: 'bold' }}>🔒 ເຂົ້າສູ່ລະບົບ</button>
                  </form>
                </div>
              </div>
            );
          }

          return (
            <div translate="no" lang={lang} style={{ padding: '20px', maxWidth: '1200px', margin: '0 auto', fontFamily: "'Noto Sans Lao', 'Phetsarath OT', sans-serif" }}>
              {(emergencyBanner || user.role === 'ADMIN') && (
                <div style={{ background: '#fef2f2', border: '2px solid #ef4444', borderRadius: '10px', padding: '15px 20px', marginBottom: '20px', boxShadow: '0 4px 10px rgba(239, 68, 68, 0.15)' }} className="no-print">
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <h3 style={{ margin: '0 0 5px 0', color: '#dc2626', fontSize: '17px', fontWeight: 'bold' }}>▲ ປະກາດຂ່າວສຸກເສີນ / ຄວາມສໍາຄັນດ່ວນ</h3>
                    {user.role === 'ADMIN' && (
                      <button onClick={() => setIsEditingBanner(!isEditingBanner)} style={{ background: '#ef4444', color: 'white', border: 'none', padding: '5px 12px', borderRadius: '6px', cursor: 'pointer', fontSize: '13px', fontWeight: 'bold' }}>{isEditingBanner ? 'ຍົກເລີກ' : '✏️ ຈັດການປະກາດ'}</button>
                    )}
                  </div>
                  {isEditingBanner ? (
                    <div style={{ marginTop: '10px' }}>
                      <textarea value={bannerInput} onChange={e => setBannerInput(e.target.value)} placeholder="ພິມຂໍ້ຄວາມປະກາດດ່ວນ..." style={{ width: '100%', height: '70px', padding: '8px', borderRadius: '6px', border: '1px solid #f87171', fontSize: '15px' }} />
                      <div style={{ marginTop: '5px', textAlign: 'right' }}><button onClick={handleSaveBanner} style={{ background: '#16a34a', color: 'white', border: 'none', padding: '6px 15px', borderRadius: '6px', fontWeight: 'bold', cursor: 'pointer' }}>💾 ບັນທຶກປະກາດ</button></div>
                    </div>
                  ) : (<p style={{ margin: '5px 0 0 0', color: '#991b1b', fontSize: '16px', fontWeight: '500', lineHeight: '1.5' }}>{emergencyBanner || 'ຍັງບໍ່ມີປະກາດຂ່າວສຸກເສີນໃນຕອນນີ້'}</p>)}
                </div>
              )}

              {activityModalMember && (
                <div style={{ position: 'fixed', top: 0, left: 0, width: '100vw', height: '100vh', background: 'rgba(0, 0, 0, 0.5)', display: 'flex', justifyContent: 'center', alignItems: 'center', zIndex: 9999 }}>
                  <div style={{ background: 'white', padding: '25px', borderRadius: '16px', width: '100%', maxWidth: '450px' }}>
                    <h3 style={{ margin: '0 0 15px 0', color: '#0369a1', fontSize: '18px', fontWeight: 'bold' }}>📸 ເພີ່ມຮູບກິດຈະກຳ: {activityModalMember.first_name}</h3>
                    <form onSubmit={handleActivitySubmit}>
                      <div style={{ marginBottom: '12px' }}><label style={labelStyle}>ເລືອກຮູບພາບກິດຈະກຳ:</label><input type="file" accept="image/*" required onChange={e => setActivityFile(e.target.files[0])} style={inputStyle} /></div>
                      <div style={{ marginBottom: '12px' }}><label style={labelStyle}>ຫົວຂໍ້ກິດຈະກຳ:</label><input type="text" value={activityForm.title} onChange={e => setActivityForm({...activityForm, title: e.target.value})} style={inputStyle} /></div>
                      <div style={{ marginBottom: '12px' }}><label style={labelStyle}>ວັນທີ/ປີ ເຮັດກິດຈະກຳ:</label><input type="text" value={activityForm.activity_date} onChange={e => setActivityForm({...activityForm, activity_date: e.target.value})} style={inputStyle} /></div>
                      <div style={{ marginBottom: '15px' }}><label style={labelStyle}>ຄຳບັນຍາຍ:</label><textarea value={activityForm.description} onChange={e => setActivityForm({...activityForm, description: e.target.value})} style={{ ...inputStyle, height: '70px' }}></textarea></div>
                      <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '10px' }}>
                        <button type="button" onClick={() => setActivityModalMember(null)} style={{ background: '#cbd5e1', padding: '8px 18px', borderRadius: '6px', cursor: 'pointer' }}>ຍົກເລີກ</button>
                        <button type="submit" style={{ background: '#0284c7', color: 'white', padding: '8px 20px', borderRadius: '6px', cursor: 'pointer' }}>💾 ບັນທຶກ</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

              {modalConfig.isOpen && (
                <div style={{ position: 'fixed', top: 0, left: 0, width: '100vw', height: '100vh', background: 'rgba(0, 0, 0, 0.5)', display: 'flex', justifyContent: 'center', alignItems: 'center', zIndex: 9999 }}>
                  <div style={{ background: 'white', padding: '25px 30px', borderRadius: '16px', textAlign: 'center', width: '100%', maxWidth: '400px' }}>
                    <h3 style={{ margin: '0 0 10px 0', fontSize: '20px', fontWeight: 'bold' }}>{modalConfig.title}</h3>
                    <p style={{ margin: '0 0 20px 0', fontSize: '16px' }}>{modalConfig.message}</p>
                    <div style={{ display: 'flex', justifyContent: 'center', gap: '12px' }}>
                      {modalConfig.isConfirm ? (<><button onClick={closeModal} style={{ background: '#cbd5e1', padding: '10px 20px', borderRadius: '8px' }}>ຍົກເລີກ</button><button onClick={() => { modalConfig.onConfirm?.(); closeModal(); }} style={{ background: '#ef4444', color: 'white', padding: '10px 20px', borderRadius: '8px' }}>ຢືນຢັນ</button></>) : (<button onClick={closeModal} style={{ background: '#0284c7', color: 'white', padding: '10px 25px', borderRadius: '8px' }}>ຕົກລົງ</button>)}
                    </div>
                  </div>
                </div>
              )}

              {reportingMember ? (
                <div style={{ marginBottom: '30px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '15px' }} className="no-print">
                    <button onClick={() => setReportingMember(null)} style={{ background: '#64748b', color: 'white', padding: '8px 16px', borderRadius: '6px' }}>⬅️ ກັບຄືນໜ້າຫຼັກ</button>
                    <button onClick={() => window.print()} style={{ background: '#3b82f6', color: 'white', padding: '8px 16px', borderRadius: '6px' }}>🖨️ ພິມໃບລາຍງານ</button>
                  </div>
                  <MemberReportCard member={reportingMember} allMembers={members} allActivities={allActivities} user={user} onOpenActivityModal={m => setActivityModalMember(m)} lang={lang} />
                </div>
              ) : isFullReport ? (
                <div style={{ marginBottom: '30px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '15px' }} className="no-print">
                    <button onClick={() => setIsFullReport(false)} style={{ background: '#64748b', color: 'white', padding: '8px 16px', borderRadius: '6px' }}>⬅️ ກັບຄືນໜ້າຫຼັກ</button>
                    <button onClick={() => window.print()} style={{ background: '#0d9488', color: 'white', padding: '8px 16px', borderRadius: '6px' }}>📊 ພິມລາຍງານລວມ</button>
                  </div>
                  <div>
                    {members.length > 0 ? members.map((m) => <MemberReportCard key={m.id} member={m} allMembers={members} allActivities={allActivities} user={user} onOpenActivityModal={mem => setActivityModalMember(mem)} lang={lang} />) : <p style={{ textAlign: 'center' }}>ຍັງບໍ່ມີຂໍ້ມູນ</p>}
                  </div>
                </div>
              ) : (
                <>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px', background: '#e2e8f0', padding: '12px 20px', borderRadius: '10px' }} className="no-print">
                    <div>👤 ຜູ້ໃຊ້: <strong>{user.username}</strong> | <span style={{ background: user.role === 'ADMIN' ? '#ef4444' : '#3b82f6', color: 'white', padding: '2px 8px', borderRadius: '12px', fontSize: '12px' }}>{user.role} (Cloud Sync)</span></div>
                    <div style={{ display: 'flex', gap: '10px', alignItems: 'center' }}>
                      <button onClick={() => setIsFullReport(true)} style={{ background: '#0d9488', color: 'white', border: 'none', padding: '8px 14px', borderRadius: '6px', cursor: 'pointer', fontWeight: 'bold' }}>📊 ພິມລາຍງານລວມ</button>
                      <button onClick={handleLogout} style={{ background: '#64748b', color: 'white', border: 'none', padding: '6px 14px', borderRadius: '6px', cursor: 'pointer' }}>ອອກຈາກລະບົບ</button>
                    </div>
                  </div>

                  <div style={{ background: '#f8fafc', border: '1px solid #cbd5e1', borderRadius: '10px', padding: '15px 20px', marginBottom: '20px' }} className="no-print">
                    <h3 style={{ margin: '0 0 12px 0', color: '#0369a1', fontSize: '16px', fontWeight: 'bold' }}>📋 ປະຫວັດການເຄື່ອນໄຫວລ່າສຸດ (Cloud)</h3>
                    {auditLogs.length > 0 ? (
                      <ol style={{ margin: 0, paddingLeft: '20px', fontSize: '14px', color: '#334155' }}>
                        {auditLogs.map((log) => (
                           <li key={log.id} style={{ marginBottom: '6px' }}>
                              <strong>{log.username}:</strong> {log.action_text} <span style={{color:'#64748b', fontSize:'12px'}}>({new Date(log.created_at).toLocaleTimeString()})</span>
                           </li>
                        ))}
                      </ol>
                    ) : (<p style={{ margin: 0, fontSize: '13px', color: '#94a3b8' }}>ຍັງບໍ່ມີປະຫວັດການເຄື່ອນໄຫວ</p>)}
                  </div>

                  <div style={{ background: editingId ? '#fefce8' : '#f8fafc', padding: '25px', borderRadius: '12px', border: `2px solid ${editingId ? '#eab308' : '#cbd5e1'}`, marginBottom: '30px' }} className="no-print">
                    <h2 style={{ fontSize: '18px', color: '#334155', marginTop: 0 }}>{editingId ? t.editMember : t.addMember}</h2>
                    <form onSubmit={handleSubmit} style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '15px' }}>
                      <div><label style={labelStyle}>{t.firstName}</label><input type="text" required value={formData.first_name} onChange={e => setFormData({...formData, first_name: e.target.value})} style={inputStyle} /></div>
                      <div><label style={labelStyle}>{t.lastName}</label><input type="text" required value={formData.last_name} onChange={e => setFormData({...formData, last_name: e.target.value})} style={inputStyle} /></div>
                      <div><label style={labelStyle}>{t.gender}</label><select value={formData.gender} onChange={e => setFormData({...formData, gender: e.target.value})} style={inputStyle}><option value="Male">{t.male}</option><option value="Female">{t.female}</option></select></div>
                      <div><label style={labelStyle}>{t.birthDate}</label><input type="text" placeholder="15/3/1973 ຫຼື 1973" value={formData.birth_date} onChange={e => setFormData({...formData, birth_date: e.target.value})} style={inputStyle} /></div>
                      
                      <div style={{ gridColumn: 'span 2' }}><label style={labelStyle}>💍 {t.spouse}:</label>
                        <select value={formData.spouse_id} onChange={e => setFormData({...formData, spouse_id: e.target.value})} style={inputStyle}>
                          <option value="">{t.selectSpouse}</option>
                          {members.filter(m => m.id !== editingId).map(m => <option key={m.id} value={m.id}>{m.first_name} {m.last_name}</option>)}
                        </select>
                      </div>

                      <div><label style={labelStyle}>{t.father}:</label>
                        <select value={formData.father_id} onChange={e => setFormData({...formData, father_id: e.target.value})} style={inputStyle}>
                          <option value="">{t.selectFather}</option>
                          {members.filter(m => m.gender === 'Male' && m.id !== editingId).map(m => <option key={m.id} value={m.id}>{m.first_name}</option>)}
                        </select>
                      </div>

                      <div><label style={labelStyle}>{t.mother}:</label>
                        <select value={formData.mother_id} onChange={e => setFormData({...formData, mother_id: e.target.value})} style={inputStyle}>
                          <option value="">{t.selectMother}</option>
                          {members.filter(m => m.gender === 'Female' && m.id !== editingId).map(m => <option key={m.id} value={m.id}>{m.first_name}</option>)}
                        </select>
                      </div>

                      <div style={{ gridColumn: 'span 2' }}><label style={labelStyle}>{t.selectPhoto}:</label><input type="file" accept="image/*" onChange={handleFileChange} style={inputStyle} /></div>
                      <div style={{ gridColumn: 'span 2' }}><label style={labelStyle}>{t.bio}</label><textarea value={formData.bio} onChange={e => setFormData({...formData, bio: e.target.value})} style={{ ...inputStyle, height: '60px' }}></textarea></div>
                      
                      <div style={{ gridColumn: 'span 2', textAlign: 'center' }}>
                        <button type="submit" style={{ background: '#0d9488', color: 'white', padding: '10px 25px', borderRadius: '6px', cursor: 'pointer', fontWeight: 'bold' }}>💾 ບັນທຶກລົງ Cloud</button>
                        {editingId && <button type="button" onClick={handleCancelEdit} style={{ background: '#ef4444', color: 'white', padding: '10px 25px', borderRadius: '6px', cursor: 'pointer', marginLeft: '10px' }}>ຍົກເລີກ</button>}
                      </div>
                    </form>
                  </div>

                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px', gap: '15px' }} className="no-print">
                    <input type="text" placeholder={t.searchPlaceholder} value={searchTerm} onChange={e => setSearchTerm(e.target.value)} style={{ flex: 1, padding: '10px 15px', borderRadius: '8px', border: '1px solid #cbd5e1' }} />
                    <div style={{ display: 'flex', gap: '5px', background: '#e2e8f0', padding: '4px', borderRadius: '8px' }}>
                      <button onClick={() => setViewMode('list')} style={{ background: viewMode === 'list' ? 'white' : 'transparent', padding: '8px 15px', borderRadius: '6px', fontWeight: 'bold' }}>📋 ລາຍຊື່ ({filteredMembers.length})</button>
                      <button onClick={() => setViewMode('tree')} style={{ background: viewMode === 'tree' ? 'white' : 'transparent', padding: '8px 15px', borderRadius: '6px', fontWeight: 'bold' }}>🌿 ຜັງຕົ້ນໄມ້</button>
                    </div>
                  </div>

                  {viewMode === 'list' ? (
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: '20px' }}>
                      {filteredMembers.map(member => (
                        <div key={member.id} style={{ border: '1px solid #e2e8f0', padding: '15px', borderRadius: '10px', background: 'white' }}>
                          <div style={{ width: '100%', height: '220px', background: '#f8fafc', borderRadius: '8px', overflow: 'hidden', display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: '10px' }}>
                            {member.photo_url ? <img src={member.photo_url} alt="" style={{ width: '100%', height: '100%', objectFit: 'contain' }} /> : <span style={{ color: '#94a3b8' }}>ບໍ່ມີຮູບພາບ</span>}
                          </div>
                          <h3 style={{ margin: '0 0 8px 0', color: '#1d4ed8' }}>{member.first_name} {member.last_name}</h3>
                          <div style={{ display: 'flex', gap: '8px', marginTop: '12px' }} className="no-print">
                            <button onClick={() => setReportingMember(member)} style={{ flex: 1, background: '#38bdf8', color: 'white', padding: '6px', borderRadius: '6px' }}>📄 ໃບລາຍງານ</button>
                            {user.role === 'ADMIN' && <button onClick={() => setActivityModalMember(member)} style={{ background: '#e0e7ff', padding: '6px 8px', borderRadius: '6px' }} title="ເພີ່ມຮູບກິດຈະກຳ">📸</button>}
                            {user.role === 'ADMIN' && <button onClick={() => handleEdit(member)} style={{ background: '#fef08a', padding: '6px 10px', borderRadius: '6px' }}>✏️</button>}
                            {user.role === 'ADMIN' && <button onClick={() => handleDelete(member.id, `${member.first_name} ${member.last_name}`)} style={{ background: '#fee2e2', padding: '6px 10px', borderRadius: '6px' }}>🗑️</button>}
                          </div>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <div className="print-tree-container" style={{ border: '1px solid #cbd5e1', padding: '20px', borderRadius: '12px', background: 'white', overflow: 'auto', maxWidth: '100%' }}>
                      <div style={{ display: 'inline-flex', minWidth: '100%', justifyContent: 'center', padding: '20px 10px' }}>
                        {rootMembers.length > 0 ? rootMembers.map(member => renderTreeNode(member)) : <p style={{ color: '#94a3b8' }}>ຍັງບໍ່ມີຂໍ້ມູນ</p>}
                      </div>
                    </div>
                  )}
                </>
              )}
            </div>
          );
        }

        const labelStyle = { display: 'block', marginBottom: '4px', fontWeight: '500', color: '#334155' };
        const inputStyle = { width: '100%', padding: '8px 12px', borderRadius: '6px', border: '1px solid #cbd5e1', fontSize: '14px', boxSizing: 'border-box' };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
