<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ລະບົບຈັດການຜັງຕະກຸນ XIONG (POS Style)</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Noto Sans Lao', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [members, setMembers] = React.useState(() => {
                const saved = localStorage.getItem('xiong_members');
                return saved ? JSON.parse(saved) : [
                    { id: 1, first_name: 'ຊົ່ງຊົ່ວ', last_name: 'ຊົ່ງ', gender: 'Male', birth_date: '1950', phone: '02055551234', village: 'ວຽງຈັນ', bio: 'ຜູ້ນຳຸ່ນທຳອິດ' }
                ];
            });

            const [form, setForm] = React.useState({ first_name: '', last_name: '', gender: 'Male', birth_date: '', phone: '', village: '', bio: '' });
            const [search, setSearch] = React.useState('');

            React.useEffect(() => {
                localStorage.setItem('xiong_members', JSON.stringify(members));
            }, [members]);

            const handleSubmit = (e) => {
                e.preventDefault();
                if(!form.first_name) return;
                const newMember = { ...form, id: Date.now() };
                setMembers([...members, newMember]);
                setForm({ first_name: '', last_name: '', gender: 'Male', birth_date: '', phone: '', village: '', bio: '' });
                alert('ບັນທຶກຂໍ້ມູນສຳເລັດ!');
            };

            const handleDelete = (id) => {
                if(confirm('ຕ້ອງການລຶບແທ້ບໍ?')) {
                    setMembers(members.filter(m => m.id !== id));
                }
            };

            const filtered = members.filter(m => `${m.first_name} ${m.last_name} ${m.village}`.toLowerCase().includes(search.toLowerCase()));

            return (
                <div className="max-w-4xl mx-auto p-4">
                    <header className="bg-sky-600 text-white p-4 rounded-xl shadow-md mb-6 text-center">
                        <h1 className="text-2xl font-bold">🌳 ລະບົບຈັດການຜັງຕະກຸນ XIONG (ແບບອອບລາຍ 100%)</h1>
                        <p className="text-sm opacity-90">ຂໍ້ມູນເກັບໄວ້ໃນເຄື່ອງສະບາຍใจ ບໍ່ມີວັນຫຼຸດ ບໍ່ມີວັນຖືກບລັອກ</p>
                    </header>

                    {/* Form ເພີ່ມຂໍ້ມູນ */}
                    <div className="bg-white p-6 rounded-xl shadow-md mb-6">
                        <h2 className="text-lg font-bold text-sky-700 mb-4">➕ ເเพิ่มຂໍ້ມູນຍາດພີ່ນ້ອງ</h2>
                        <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input type="text" placeholder="ຊື່" value={form.first_name} onChange={e=>setForm({...form, first_name: e.target.value})} className="border p-2 rounded" required />
                            <input type="text" placeholder="ນາມສະກຸນ" value={form.last_name} onChange={e=>setForm({...form, last_name: e.target.value})} className="border p-2 rounded" />
                            <select value={form.gender} onChange={e=>setForm({...form, gender: e.target.value})} className="border p-2 rounded">
                                <option value="Male">ຊາຍ</option>
                                <option value="Female">ຍິງ</option>
                            </select>
                            <input type="text" placeholder="ປີເກີດ (ເຊັ່ນ: 1990)" value={form.birth_date} onChange={e=>setForm({...form, birth_date: e.target.value})} className="border p-2 rounded" />
                            <input type="text" placeholder="ເບີໂທລະສັບ" value={form.phone} onChange={e=>setForm({...form, phone: e.target.value})} className="border p-2 rounded" />
                            <input type="text" placeholder="ບ້ານຢູ່ປະຈຸບັນ" value={form.village} onChange={e=>setForm({...form, village: e.target.value})} className="border p-2 rounded" />
                            <textarea placeholder="ປະຫວັດຫຍໍ້..." value={form.bio} onChange={e=>setForm({...form, bio: e.target.value})} className="border p-2 rounded md:col-span-2"></textarea>
                            <button type="submit" className="bg-emerald-600 text-white font-bold p-2 rounded md:col-span-2 hover:bg-emerald-700">💾 ບັນທຶກຂໍ້ມູນ</button>
                        </form>
                    </div>

                    {/* ຊ່ອງຄົ້ນຫາ ແລະ ລາຍຊື່ */}
                    <div className="bg-white p-6 rounded-xl shadow-md">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-lg font-bold text-sky-700">📋 ລາຍຊື່ສະມາຊິກ ({filtered.length})</h2>
                            <input type="text" placeholder="🔍 ค้นหาຊື່, ບ້ານ..." value={search} onChange={e=>setSearch(e.target.value)} className="border p-2 rounded w-1/3" />
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {filtered.map(m => (
                                <div key={m.id} className="border p-4 rounded-lg shadow-sm bg-slate-50 flex justify-between items-start">
                                    <div>
                                        <h3 className="font-bold text-sky-800 text-lg">{m.first_name} {m.last_name} ({m.gender === 'Male' ? 'ຊາຍ' : 'ຍິງ'})</h3>
                                        <p className="text-sm text-slate-600">📅 ປີເກີດ: {m.birth_date || '-'}</p>
                                        <p className="text-sm text-slate-600">📞 ໂທ: {m.phone || '-'}</p>
                                        <p className="text-sm text-slate-600">🏠 ບ້ານ: {m.village || '-'}</p>
                                        {m.bio && <p className="text-xs text-slate-500 mt-2">ℹ️ {m.bio}</p>}
                                    </div>
                                    <button onClick={() => handleDelete(m.id)} className="text-red-500 hover:text-red-700 font-bold p-1">🗑️</button>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
